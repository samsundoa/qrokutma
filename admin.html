<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim / Yükleme Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
        .container { width: 100%; max-width: 450px; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        #loginScreen h1 { font-size: 20px; margin-bottom: 20px; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 6px; color: #7f8c8d; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 8px; font-size: 15px; }
        
        #adminScreen { display: none; }
        #adminScreen.active { display: block; }
        h1 { font-size: 22px; margin-bottom: 20px; color: #2c3e50; text-align: center; }
        .btn { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background-color: #3498db; color: white; margin-top: 10px; }
        .btn-primary:hover { background-color: #2980b9; }
        .file-input-wrapper { border: 2px dashed #bdc3c7; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 20px; background: #fafafa; cursor: pointer; }
        .status-box { margin-top: 20px; font-size: 14px; color: #555; text-align: center; font-weight: bold; }
        .back-link { display: inline-block; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 14px; text-align: center; width: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. GİRİŞ EKRANI -->
        <div id="loginScreen">
            <h1>YÖNETİM GİRİŞİ</h1>
            <div class="form-group">
                <label>E-posta Adresi</label>
                <input type="email" id="emailInput" placeholder="admin@depo.com">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="passwordInput" placeholder="Şifreniz">
            </div>
            <button class="btn btn-primary" onclick="checkLogin()">GİRİŞ YAP</button>
            <br>
            <a href="index.html" class="back-link">&larr; Ana Sayfaya Dön</a>
        </div>

        <!-- 2. ASIL YÖNETİM PANELİ -->
        <div id="adminScreen">
            <h1>QR YÜKLEME PANELİ</h1>
            
            <div class="file-input-wrapper" onclick="document.getElementById('qrFiles').click()">
                <p>📁 QR Görsellerini Seçmek İçin Tıkla</p>
                <input type="file" id="qrFiles" multiple accept="image/*" style="display: none;">
            </div>

            <button class="btn btn-primary" id="uploadBtn" onclick="uploadQRs()">YÜKLEMEYİ BAŞLAT</button>
            <div class="status-box" id="statusText">Seçilen dosya yok.</div>
            
            <a href="index.html" class="back-link">&larr; Ana Sayfaya Dön</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDDrB1HQwibxGNgM4OSPDzI05x1KMdqH14",
            authDomain: "samsundoa.firebaseapp.com",
            projectId: "samsundoa",
            storageBucket: "samsundoa.firebasestorage.app",
            messagingSenderId: "757904973555",
            appId: "1:757904973555:web:4f6de06dfdb114f6632186",
            measurementId: "G-04G6VXDE52"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.checkLogin = async function() {
            const email = document.getElementById('emailInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminScreen').classList.add('active');
            } catch (error) {
                alert("Giriş başarısız! E-posta veya şifre hatalı.");
            }
        };

        window.uploadQRs = async function() {
            const fileInput = document.getElementById('qrFiles');
            const statusText = document.getElementById('statusText');
            const uploadBtn = document.getElementById('uploadBtn');

            if (fileInput.files.length === 0) {
                alert("Lütfen önce QR görsellerini seçin!");
                return;
            }

            uploadBtn.disabled = true;
            let successCount = 0;
            const totalFiles = fileInput.files.length;

            for (let i = 0; i < totalFiles; i++) {
                const file = fileInput.files[i];
                statusText.innerText = `Yükleniyor: ${i + 1} / ${totalFiles} (${file.name})`;

                try {
                    const dataUrl = await readFileAsDataURL(file);
                    await addDoc(collection(db, "qr_pool"), {
                        name: file.name,
                        dataUrl: dataUrl,
                        status: "kullanilmadi",
                        createdAt: new Date()
                    });
                    successCount++;
                } catch (err) {
                    console.error("Yükleme hatası:", file.name, err);
                }
            }

            statusText.innerText = `Tamamlandı! Toplam ${successCount} adet QR havuza eklendi.`;
            uploadBtn.disabled = false;
            fileInput.value = "";
        };

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
